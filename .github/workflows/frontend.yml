# Frontend (Vue) -> druga Web App na planie App Service API (Node 22, pliki serwuje pm2 serve --spa).
# Wymaga: secret AZURE_FRONTEND_PUBLISH_PROFILE, variables AZURE_FRONTEND_APP_NAME i VITE_API_BASE_URL
# (adres API na App Service, bez "/" na koncu i bez "/api").
# Automatycznie po pushu na main (zmiany w frontend/). Recznie: Actions -> Run workflow
# (GitHub pokazuje ten przycisk dopiero, gdy plik workflowu jest na main; wtedy mozna wybrac dowolna galaz).

name: Frontend -> Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      # Bez adresu API build by "dzialal", ale frontend wolalby /api pod wlasnym adresem (brak proxy) -> lepiej przerwac.
      - name: Sprawdz VITE_API_BASE_URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Brak zmiennej VITE_API_BASE_URL (Settings -> Secrets and variables -> Actions -> Variables)"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja i build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Zawartosc dist/ trafia do /home/site/wwwroot; serwuje ja pm2 (Startup Command w portalu).
      - name: Deploy do App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: frontend/dist
