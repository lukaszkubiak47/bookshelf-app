# Backend (Bookshelf.API, .NET 10) -> Azure App Service.
# Wymaga: secret AZURE_WEBAPP_PUBLISH_PROFILE, variable AZURE_WEBAPP_NAME (Settings -> Secrets and variables -> Actions).
# Automatycznie po pushu na main (zmiany w backend/). Recznie: Actions -> Run workflow
# (GitHub pokazuje ten przycisk dopiero, gdy plik workflowu jest na main; wtedy mozna wybrac dowolna galaz).

name: API -> Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish backend/Bookshelf.API/Bookshelf.API.csproj -c Release -o "${{ runner.temp }}/api"

      - name: Deploy do App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/api
