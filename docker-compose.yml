# Bookshelf — pelny stack lokalny: MSSQL + Redis + API (.NET 10) + web (nginx serwuje Vue + proxy /api).
# Uruchomienie: docker compose up --build  (z roota repo). Wejscie: http://localhost:8088
# Wymaga pliku .env (w roocie) z MSSQL_SA_PASSWORD — gitignored, nie commitowac.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"                  # opcjonalne — dostep z SSMS / Azure Data Studio
    volumes:
      - mssql-data:/var/opt/mssql    # trwalosc danych bazy
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s              # MSSQL wstaje ~20-40s przy pierwszym boot
    networks: [bookshelf-net]

  api:
    build:
      context: ./backend/Bookshelf.API
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      RunMigrations: "true"          # WLACZA auto-migracje przy starcie (gating — tylko tutaj)
      ConnectionStrings__Default: "Server=db,1433;Database=BookshelfDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;Encrypt=False"
      GoogleBooks__ApiKey: "${GOOGLE_BOOKS_API_KEY}"   # klucz Google Books z .env (gitignored, nie w repo)
      ConnectionStrings__Redis: "redis:6379"             # cache + limit prob (w Azure: Azure Managed Redis)
      ConnectionStrings__Storage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      Storage__PublicBlobUrl: "http://localhost:10000/devstoreaccount1"   # adres bloba widoczny z przegladarki (podmiana w linkach SAS)
    depends_on:
      db:
        condition: service_healthy   # czeka az healthcheck bazy przejdzie
      redis:
        condition: service_started
      azurite:
        condition: service_started
    ports:
      - "8080:8080"                  # opcjonalne — bezposredni dostep do API
    networks: [bookshelf-net]

  redis:
    image: redis:7-alpine           # lokalny odpowiednik Azure Managed Redis
    networks: [bookshelf-net]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite   # lokalny odpowiednik Azure Storage (blob/queue/table)
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000", "10001:10001", "10002:10002"]
    networks: [bookshelf-net]
  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8088:80"                    # <-- wejscie w przegladarce: http://localhost:8088
    networks: [bookshelf-net]

volumes:
  mssql-data:

networks:
  bookshelf-net:
    driver: bridge
